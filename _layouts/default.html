<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fabian Bleile — research, publications, and curriculum vitae.">
  <meta name="google-site-verification" content="ziC14bpLlxU6Y1dY5ZguKoGDHY__IluniMwrcFTC3C0">
  <link rel="canonical" href="https://fbleile.github.io/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Fabian Bleile</title>
  <script data-goatcounter="https://fbleile.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <noscript><img src="https://fbleile.goatcounter.com/count?p=/index&amp;t=NoScript" alt=""></noscript>
  <style>
    :root { --ink:#202a2e; --muted:#687277; --line:#dfe4e4; --accent:#176b63; --max:760px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:#fff; font:16px/1.7 Georgia, 'Times New Roman', serif; }
    a { color:var(--accent); text-underline-offset:3px; }
    .shell { width:min(calc(100% - 40px), var(--max)); margin:0 auto; }
    header { position:relative; min-height:198px; overflow:hidden; border-bottom:1px solid var(--line); }
    .hero-wallpaper { position:absolute; inset:-28px 0 -28px; z-index:0; overflow:hidden; }
    .hero-wallpaper img { width:100%; height:100%; object-fit:cover; object-position:center; transform:translate3d(0, var(--hero-offset, 0px), 0) scale(1.08); will-change:transform; }
    .hero-scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.48) 58%, rgba(25,42,43,.18)); }
    .header-content { position:relative; z-index:1; padding-top:30px; }
    .masthead { display:flex; align-items:baseline; justify-content:space-between; gap:24px; }
    .name { color:var(--ink); font-size:1.7rem; font-weight:700; text-decoration:none; letter-spacing:-.03em; }
    .role { margin:0; color:var(--muted); font-size:.95rem; }
    nav { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:14px; }
    nav a { color:var(--ink); background:rgba(255,255,255,.68); border-radius:999px; padding:2px 9px; font-size:.92rem; text-decoration:none; }
    nav a:hover { color:var(--accent); background:rgba(255,255,255,.88); }
    main { padding:64px 0 80px; }
    #content > :first-child { margin-top:0; }
    h1,h2,h3 { line-height:1.2; letter-spacing:-.02em; }
    h1 { margin:0 0 20px; font-size:clamp(2.4rem, 7vw, 4.5rem); font-weight:400; }
    h2 { margin:64px 0 18px; padding-top:28px; border-top:1px solid var(--line); font-size:1.8rem; font-weight:400; }
    h3 { margin:30px 0 8px; font-size:1.2rem; }
    p { margin:0 0 18px; }
    ul { margin:0 0 22px; padding-left:24px; }
    .paper-video { float:right; width:min(42%, 280px); margin:0 0 18px 26px; border-radius:10px; background:#202a2e; box-shadow:0 8px 24px rgba(32,42,46,.12); }
    #content::after { display:block; clear:both; content:""; }
    footer { padding:22px 0 34px; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem; }
    footer p { margin:0 0 10px; }
    .footer-links { display:flex; flex-wrap:wrap; gap:4px 18px; }
    .footer-links a { color:var(--muted); }
    [data-hover-video] { cursor:default; }
    @media (max-width:520px) { .paper-video { float:none; width:100%; margin:0 0 18px; } }
    @media (max-width:620px) {
      .shell { width:min(calc(100% - 28px), var(--max)); }
      .masthead { display:block; }
      .role { margin-top:4px; }
      main { padding-top:48px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hero-wallpaper" data-parallax aria-hidden="true"><img src="wallpaper-banner.jpg" alt=""><div class="hero-scrim"></div></div>
    <div class="shell header-content">
      <div class="masthead"><a class="name" href="#top">Fabian Bleile</a><p class="role">PhD Candidate Mathematical Statistics</p></div>
      <nav aria-label="Primary navigation">
        <a href="#about">About</a><a href="#research">Research</a><a href="#publications">Publications</a><a href="#cv">CV</a>
      </nav>
    </div>
  </header>
  <main id="top" class="shell"><article id="content">__CONTENT__</article></main>
  <footer><div class="shell"><p>© 2026 Fabian Bleile · <a href="#top">Back to top</a></p><div class="footer-links"><a href="https://scholar.google.de/citations?user=Kp9tLXgAAAAJ&amp;hl=de">Google Scholar</a><a href="https://www.linkedin.com/in/fabian-b-a7519a16/">LinkedIn</a><a href="https://campus.tum.de/tumonline/visitenkarte.show_vcard?pPersonenGruppe=3&amp;pPersonenId=21FD226BAA00CDD7">TUM profile</a><a href="https://github.com/fbleile?tab=repositories">GitHub</a></div></div></footer>
  <script>
    const wallpaper = document.querySelector('[data-parallax]');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (wallpaper && !prefersReducedMotion) {
      let ticking = false;
      const updateWallpaper = () => {
        wallpaper.style.setProperty('--hero-offset', `${window.scrollY * 0.12}px`);
        ticking = false;
      };
      window.addEventListener('scroll', () => {
        if (!ticking) { window.requestAnimationFrame(updateWallpaper); ticking = true; }
      }, { passive: true });
    }
    document.querySelectorAll('[data-hover-video]').forEach((video) => {
      video.addEventListener('pointerenter', () => { video.play().catch(() => {}); });
      video.addEventListener('pointerleave', () => { video.pause(); video.currentTime = 0; });
    });
  </script>
</body>
</html>
