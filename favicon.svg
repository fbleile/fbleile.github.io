<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Fabian Bleile — causal dynamics</title>
  <desc id="desc">A directed causal graph with a gold stochastic sample path feeding into the lower node.</desc>
  <rect width="64" height="64" rx="14" fill="#202a2e"/>

  <!-- Symmetric white arrows, aligned with the node centres. -->
  <g fill="#ffffff">
    <path d="M0-1.2H5.104V-3.1L10.404 0 5.104 3.1V1.2H0Z" transform="translate(18.105 21.192) rotate(37.875)"/>
    <path d="M0-1.2H6.383V-3.1L11.683 0 6.383 3.1V1.2H0Z" transform="translate(35.887 28.545) rotate(-41.634)"/>
    <path d="M0-1.2H6.383V-3.1L11.683 0 6.383 3.1V1.2H0Z" transform="translate(35.887 35.455) rotate(41.634)"/>
  </g>

  <!-- An irregular noise trajectory, rather than a periodic wave. -->
  <path d="m10 49 4-3 4 6 5-10 4 7 4-3 4 2h5"
        fill="none" stroke="#f1c878" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m43 48-5.3-3.1v6.2z" fill="#ffffff"/>

  <g fill="#f7fbf9">
    <circle cx="14" cy="18" r="5.5"/>
    <circle cx="32" cy="32" r="5.5"/>
    <circle cx="50" cy="16" r="5.5"/>
    <circle cx="50" cy="48" r="5.5"/>
  </g>
</svg>
